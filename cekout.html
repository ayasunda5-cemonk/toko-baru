<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Toko Baru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><nav class="navbar"><a href="index.html" class="logo">Toko Baru</a>
    <div class="nav-links"><a href="index.html">Home</a><a href="produk.html">Produk</a><a href="keranjang.html">Keranjang (<span class="cart-badge">0</span>)</a></div>
  </nav></header>
  <main class="container">
    <h2>Formulir Checkout</h2>
    <div class="card-box" style="margin-top:1rem;">
      <h3>Ringkasan Pesanan</h3>
      <div id="checkout-summary" style="margin:1rem 0;"></div>
      <form id="checkout-form">
        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="cust-name" required placeholder="Nama Anda"></div>
        <div class="form-group"><label>Alamat Pengiriman</label><textarea id="cust-address" rows="3" required placeholder="Alamat lengkap"></textarea></div>
        <div class="form-group"><label>Metode Pembayaran</label>
          <select id="cust-payment"><option>Transfer Bank / QRIS</option><option>COD (Bayar di Tempat)</option></select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Kirim Pesanan ke WhatsApp</button>
      </form>
    </div>
  </main>
  <footer><p>&copy; 2026 Toko Baru</p></footer>
  <script src="script.js"></script>
</body>
</html>
